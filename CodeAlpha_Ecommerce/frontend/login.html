<!DOCTYPE html>
<html lang="en" class="h-full bg-[#080B14] text-[#F8FAFC]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CodeAlpha Store</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-full flex flex-col bg-[#080B14] text-[#F8FAFC] antialiased">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0B1020]/90 border-b border-[#27304A] transition-shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <a href="index.html" class="flex items-center gap-2.5 group">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-950 group-hover:bg-indigo-500 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </div>
          <span class="font-extrabold text-lg tracking-tight text-[#F8FAFC] group-hover:text-indigo-400 transition-colors">
            CodeAlpha<span class="text-indigo-400">.</span>
          </span>
        </a>

        <nav class="hidden md:flex items-center gap-1">
          <a href="index.html" class="text-sm font-medium px-3 py-1.5 rounded-lg text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-[#151B2D] transition-colors">Home</a>
          <a href="products.html" class="text-sm font-medium px-3 py-1.5 rounded-lg text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-[#151B2D] transition-colors">Products</a>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <!-- Cart Button -->
        <a href="cart.html" class="btn-press relative flex items-center gap-2 px-3.5 py-1.5 sm:py-2 rounded-full bg-[#151B2D] hover:bg-[#1B2438] text-[#F8FAFC] border border-[#27304A] text-xs sm:text-sm font-semibold transition-colors" title="View Shopping Cart">
          <svg class="w-4 h-4 text-[#CBD5E1]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>Cart</span>
          <span id="cart-count" class="w-5 h-5 rounded-full bg-indigo-600 text-white text-[11px] font-bold flex items-center justify-center">0</span>
        </a>

        <!-- Dynamic Auth Container -->
        <div id="nav-auth-container" class="flex items-center gap-2"></div>
      </div>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="max-w-md mx-auto px-4 py-16 flex-1 w-full flex items-center justify-center">
    <div class="w-full bg-[#111827] rounded-2xl border border-[#27304A] shadow-xl p-8 animate-fade-in-up">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-extrabold text-[#F8FAFC] tracking-tight mb-2">Welcome Back</h1>
        <p class="text-xs text-[#94A3B8]">Sign in to track orders and complete checkout smoothly.</p>
      </div>

      <div id="auth-alert" style="display: none;" class="p-3.5 rounded-lg border border-rose-800/60 bg-rose-950/50 text-rose-300 text-xs font-medium mb-5"></div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-[#CBD5E1] uppercase tracking-wider mb-1.5" for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            placeholder="user@example.com" 
            required 
            autocomplete="email"
            class="w-full px-3.5 py-2.5 rounded-lg border border-[#27304A] bg-[#0B1020] focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 outline-none text-sm text-[#F8FAFC] placeholder-[#94A3B8]/60 transition-all"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-[#CBD5E1] uppercase tracking-wider mb-1.5" for="login-password">Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="login-password" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
              class="w-full pl-3.5 pr-10 py-2.5 rounded-lg border border-[#27304A] bg-[#0B1020] focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 outline-none text-sm text-[#F8FAFC] placeholder-[#94A3B8]/60 transition-all"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility('login-password', this)" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200"
              title="Toggle password visibility"
            >
              <svg class="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="login-btn" 
          class="btn-press w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-xl shadow-sm transition-colors mt-2"
        >
          Sign In
        </button>

        <!-- Quick Demo Account Helper -->
        <div class="pt-4 border-t border-[#1E293B] text-center">
          <button 
            type="button" 
            onclick="fillDemoCredentials()" 
            class="btn-press w-full py-2.5 px-3 rounded-lg border border-indigo-700/50 bg-indigo-950/60 hover:bg-indigo-900/60 text-indigo-300 text-xs font-semibold transition-colors flex items-center justify-center gap-1.5"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Quick-Fill Demo Account (demo@codealpha.com)
          </button>
        </div>
      </form>

      <div class="text-center text-xs text-[#94A3B8] mt-6 pt-4 border-t border-[#1E293B]">
        Don't have an account? <a href="register.html" class="text-indigo-400 font-semibold hover:text-indigo-300">Register here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#0B1020] border-t border-[#27304A] py-8 text-center text-xs text-[#94A3B8] mt-auto">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 CodeAlpha Full Stack Development Internship &bull; Task 1: Simple E-commerce Store by Md. Tanjimul Islam</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (isAuthenticated()) {
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');
        window.location.href = redirect ? decodeURIComponent(redirect) : 'products.html';
      }
    });

    function fillDemoCredentials() {
      document.getElementById('login-email').value = 'demo@codealpha.com';
      document.getElementById('login-password').value = 'password123';
      showToast('Populated demo credentials!');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      const alertBox = document.getElementById('auth-alert');

      alertBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      try {
        const res = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (res.success && res.token) {
          saveAuth(res.token, res.user);
          showToast(`Welcome back, ${res.user.name}!`);

          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');

          setTimeout(() => {
            window.location.href = redirect ? decodeURIComponent(redirect) : 'products.html';
          }, 350);
        }
      } catch (err) {
        alertBox.textContent = err.message || 'Login failed. Please verify your credentials.';
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
