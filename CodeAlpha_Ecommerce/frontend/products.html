<!DOCTYPE html>
<html lang="en" class="h-full bg-[#080B14] text-[#F8FAFC]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Products - CodeAlpha Store</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-full flex flex-col bg-[#080B14] text-[#F8FAFC] antialiased">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0B1020]/90 border-b border-[#27304A] transition-shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <a href="index.html" class="flex items-center gap-2.5 group">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-950 group-hover:bg-indigo-500 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </div>
          <span class="font-extrabold text-lg tracking-tight text-[#F8FAFC] group-hover:text-indigo-400 transition-colors">
            CodeAlpha<span class="text-indigo-400">.</span>
          </span>
        </a>

        <nav class="hidden md:flex items-center gap-1">
          <a href="index.html" class="text-sm font-medium px-3 py-1.5 rounded-lg text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-[#151B2D] transition-colors">Home</a>
          <a href="products.html" class="text-sm font-semibold px-3 py-1.5 rounded-lg text-indigo-400 bg-indigo-950/70 border border-indigo-700/40">Products</a>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <!-- Cart Button -->
        <a href="cart.html" class="btn-press relative flex items-center gap-2 px-3.5 py-1.5 sm:py-2 rounded-full bg-[#151B2D] hover:bg-[#1B2438] text-[#F8FAFC] border border-[#27304A] text-xs sm:text-sm font-semibold transition-colors" title="View Shopping Cart">
          <svg class="w-4 h-4 text-[#CBD5E1]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>Cart</span>
          <span id="cart-count" class="w-5 h-5 rounded-full bg-indigo-600 text-white text-[11px] font-bold flex items-center justify-center">0</span>
        </a>

        <!-- Dynamic Auth Container -->
        <div id="nav-auth-container" class="flex items-center gap-2"></div>
      </div>
    </div>
  </header>

  <!-- Page Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full animate-fade-in-up">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-[#F8FAFC] tracking-tight mb-2">Product Catalog</h1>
      <p class="text-sm text-[#94A3B8] max-w-xl">Browse our complete collection of verified gadgets, lifestyle accessories, and essentials.</p>
    </div>

    <!-- Controls Header -->
    <div class="bg-[#111827] rounded-2xl border border-[#27304A] shadow-md p-5 sm:p-6 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
      <!-- Search Input -->
      <form class="relative w-full md:w-80" onsubmit="handleSearch(event)">
        <svg class="w-4 h-4 text-[#94A3B8] absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search products by name..." 
          class="w-full pl-10 pr-4 py-2 text-sm bg-[#0B1020] border border-[#27304A] rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all text-[#F8FAFC] placeholder-[#94A3B8]" 
        />
      </form>

      <!-- Category Filter Pills -->
      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto" id="category-pills">
        <!-- Injected dynamically via loadCategories() -->
      </div>
    </div>

    <!-- Product Grid -->
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Injected dynamically via loadProducts() -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#0B1020] border-t border-[#27304A] py-8 text-center text-xs text-[#94A3B8] mt-auto">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 CodeAlpha Full Stack Development Internship &bull; Task 1: Simple E-commerce Store by Md. Tanjimul Islam</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadCategories();
      loadProducts();
    });
  </script>
</body>
</html>
