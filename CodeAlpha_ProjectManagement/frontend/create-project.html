<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Project — CodeAlpha Project Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgMain: '#080B14',
            bgSurface: '#111827',
            bgElevated: '#151B2D',
            borderCol: '#27304A',
            primaryBrand: '#6366F1',
            primaryHover: '#818CF8',
            textMain: '#F8FAFC',
            textSub: '#CBD5E1',
            textMuted: '#94A3B8'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#080B14] text-[#F8FAFC] min-h-screen flex flex-col">
  <!-- Navigation -->
  <nav class="border-b border-[#27304A] bg-[#111827]/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <a href="index.html" class="flex items-center gap-2.5 font-bold text-lg text-white">
          <div class="w-8 h-8 rounded-lg bg-[#6366F1] flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
          </div>
          <span>Plan<span class="text-[#6366F1]">Flow</span></span>
        </a>
        <div class="hidden md:flex items-center gap-1">
          <a href="index.html" class="px-3 py-1.5 rounded-lg text-sm font-medium text-[#CBD5E1] hover:text-[#F8FAFC] hover:bg-[#151B2D] transition-colors">Dashboard</a>
          <a href="projects.html" class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-[#151B2D] text-[#6366F1] border border-[#27304A]">Projects</a>
          <a href="tasks.html" class="px-3 py-1.5 rounded-lg text-sm font-medium text-[#CBD5E1] hover:text-[#F8FAFC] hover:bg-[#151B2D] transition-colors">Tasks</a>
        </div>
      </div>
      <div id="nav-user-area" class="flex items-center gap-3"></div>
    </div>
  </nav>

  <!-- Form Content -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 py-10">
    <div class="mb-6">
      <a href="projects.html" class="inline-flex items-center gap-1.5 text-xs text-[#94A3B8] hover:text-[#F8FAFC] transition-colors mb-3">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Projects
      </a>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-[#F8FAFC] tracking-tight">Create New Project</h1>
      <p class="text-sm text-[#94A3B8] mt-1">Initialize a collaborative workspace for your team.</p>
    </div>

    <form id="create-project-form" class="bg-[#111827] border border-[#27304A] rounded-2xl p-6 sm:p-8 space-y-6">
      <div>
        <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-2">Project Name *</label>
        <input type="text" id="name" required placeholder="e.g. CloudSync Migration"
          class="w-full px-4 py-3 bg-[#151B2D] border border-[#27304A] rounded-xl text-sm text-[#F8FAFC] placeholder-[#94A3B8] focus:outline-none focus:border-[#6366F1] transition-colors" />
      </div>

      <div>
        <label for="description" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-2">Description</label>
        <textarea id="description" rows="4" placeholder="Briefly describe the deliverables, goals, and milestones..."
          class="w-full px-4 py-3 bg-[#151B2D] border border-[#27304A] rounded-xl text-sm text-[#F8FAFC] placeholder-[#94A3B8] focus:outline-none focus:border-[#6366F1] transition-colors"></textarea>
      </div>

      <div>
        <label for="status" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-2">Initial Status</label>
        <select id="status"
          class="w-full px-4 py-3 bg-[#151B2D] border border-[#27304A] rounded-xl text-sm text-[#F8FAFC] focus:outline-none focus:border-[#6366F1] transition-colors">
          <option value="Active">Active</option>
          <option value="Completed">Completed</option>
          <option value="Archived">Archived</option>
        </select>
      </div>

      <div class="pt-4 border-t border-[#27304A] flex items-center justify-end gap-3">
        <a href="projects.html" class="px-5 py-2.5 rounded-xl text-sm font-medium text-[#CBD5E1] hover:text-[#F8FAFC] hover:bg-[#151B2D] transition-colors">Cancel</a>
        <button type="submit" id="submit-btn" class="px-6 py-2.5 bg-[#6366F1] hover:bg-[#818CF8] text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-500/20 transition-all">
          Create Workspace
        </button>
      </div>
    </form>
  </main>

  <footer class="border-t border-[#27304A] py-6 text-center text-xs text-[#94A3B8]">
    <p>CodeAlpha Task 3 — Project Management Application | Developed by <span class="text-[#CBD5E1] font-medium">Md. Tanjimul Islam</span></p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireAuth();
      UI.setupNavbar();
      UI.initIcons();

      const form = document.getElementById('create-project-form');
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating...';

        const name = document.getElementById('name').value.trim();
        const description = document.getElementById('description').value.trim();
        const status = document.getElementById('status').value;

        try {
          const res = await API.post('/projects', { name, description, status });
          UI.showToast('Project created successfully!', 'success');
          setTimeout(() => {
            window.location.href = `project-details.html?id=${res.project.id}`;
          }, 800);
        } catch (err) {
          UI.showToast(err.message || 'Failed to create project', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Workspace';
        }
      });
    });
  </script>
</body>
</html>
