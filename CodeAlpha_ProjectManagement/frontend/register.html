<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CodeAlpha Project Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgMain: '#080B14',
            bgSurface: '#111827',
            bgElevated: '#151B2D',
            borderCol: '#27304A',
            primaryBrand: '#6366F1',
            primaryHover: '#818CF8',
            textMain: '#F8FAFC',
            textSub: '#CBD5E1',
            textMuted: '#94A3B8'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#080B14] text-[#F8FAFC] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <!-- Header Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#6366F1] text-white shadow-xl shadow-indigo-500/25 mb-4">
        <i data-lucide="layout-grid" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-[#F8FAFC] tracking-tight">Create Account</h1>
      <p class="text-sm text-[#94A3B8] mt-1">Get started with CodeAlpha Project Management</p>
    </div>

    <!-- Register Card -->
    <div class="bg-[#111827] border border-[#27304A] rounded-2xl p-6 sm:p-8 shadow-2xl space-y-5">
      <form id="register-form" class="space-y-4">
        <div>
          <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-1.5">Full Name</label>
          <input type="text" id="name" required placeholder="e.g. Tanjimul Islam"
            class="w-full px-4 py-3 bg-[#151B2D] border border-[#27304A] rounded-xl text-sm text-[#F8FAFC] placeholder-[#94A3B8] focus:outline-none focus:border-[#6366F1] transition-colors" />
        </div>

        <div>
          <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-1.5">Username</label>
          <input type="text" id="username" required placeholder="e.g. tanjimul"
            class="w-full px-4 py-3 bg-[#151B2D] border border-[#27304A] rounded-xl text-sm text-[#F8FAFC] placeholder-[#94A3B8] focus:outline-none focus:border-[#6366F1] transition-colors" />
        </div>

        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-1.5">Email Address</label>
          <input type="email" id="email" required placeholder="user@example.com"
            class="w-full px-4 py-3 bg-[#151B2D] border border-[#27304A] rounded-xl text-sm text-[#F8FAFC] placeholder-[#94A3B8] focus:outline-none focus:border-[#6366F1] transition-colors" />
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-1.5">Password</label>
          <input type="password" id="password" required placeholder="••••••••" minlength="6"
            class="w-full px-4 py-3 bg-[#151B2D] border border-[#27304A] rounded-xl text-sm text-[#F8FAFC] placeholder-[#94A3B8] focus:outline-none focus:border-[#6366F1] transition-colors" />
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3 bg-[#6366F1] hover:bg-[#818CF8] text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-500/25 transition-all">
          Create Account
        </button>
      </form>

      <p class="text-center text-xs text-[#94A3B8] pt-2">
        Already have an account?
        <a href="login.html" class="text-[#6366F1] hover:text-[#818CF8] font-semibold transition-colors">Log In</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.redirectIfAuthenticated();
      UI.initIcons();

      const form = document.getElementById('register-form');
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering...';

        const name = document.getElementById('name').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          await Auth.register(name, username, email, password);
          UI.showToast('Account created successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        } catch (err) {
          UI.showToast(err.message || 'Registration failed', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
