<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — CodeAlpha Project Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgMain: '#080B14',
            bgSurface: '#111827',
            bgElevated: '#151B2D',
            borderCol: '#27304A',
            primaryBrand: '#6366F1',
            primaryHover: '#818CF8',
            textMain: '#F8FAFC',
            textSub: '#CBD5E1',
            textMuted: '#94A3B8'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#080B14] text-[#F8FAFC] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <!-- Header Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#6366F1] text-white shadow-xl shadow-indigo-500/25 mb-4">
        <i data-lucide="layout-grid" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-[#F8FAFC] tracking-tight">Welcome Back</h1>
      <p class="text-sm text-[#94A3B8] mt-1">Sign in to your CodeAlpha Project Management account</p>
    </div>

    <!-- Login Card -->
    <div class="bg-[#111827] border border-[#27304A] rounded-2xl p-6 sm:p-8 shadow-2xl space-y-5">
      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-1.5">Email Address</label>
          <input type="email" id="email" required placeholder="demo@codealpha.com"
            class="w-full px-4 py-3 bg-[#151B2D] border border-[#27304A] rounded-xl text-sm text-[#F8FAFC] placeholder-[#94A3B8] focus:outline-none focus:border-[#6366F1] transition-colors" />
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-1.5">Password</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full px-4 py-3 bg-[#151B2D] border border-[#27304A] rounded-xl text-sm text-[#F8FAFC] placeholder-[#94A3B8] focus:outline-none focus:border-[#6366F1] transition-colors" />
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3 bg-[#6366F1] hover:bg-[#818CF8] text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-500/25 transition-all">
          Sign In
        </button>
      </form>

      <!-- Quick Fill Demo -->
      <div class="pt-4 border-t border-[#27304A]/60">
        <button id="quick-demo-btn" type="button" class="w-full py-2 bg-[#151B2D] hover:bg-[#1E293B] text-xs font-semibold text-[#CBD5E1] rounded-xl border border-[#27304A] transition-colors flex items-center justify-center gap-2">
          <i data-lucide="zap" class="w-3.5 h-3.5 text-[#FBBF24]"></i> Autofill Demo Credentials
        </button>
      </div>

      <p class="text-center text-xs text-[#94A3B8] pt-2">
        Don't have an account?
        <a href="register.html" class="text-[#6366F1] hover:text-[#818CF8] font-semibold transition-colors">Register</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.redirectIfAuthenticated();
      UI.initIcons();

      const demoBtn = document.getElementById('quick-demo-btn');
      demoBtn?.addEventListener('click', () => {
        document.getElementById('email').value = 'demo@codealpha.com';
        document.getElementById('password').value = 'password123';
      });

      const form = document.getElementById('login-form');
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          await Auth.login(email, password);
          UI.showToast('Logged in successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        } catch (err) {
          UI.showToast(err.message || 'Login failed', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
